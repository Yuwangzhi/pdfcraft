# Builds the native x64 portable package and its offline UI regression executable.
# This lets a user test the exact reviewed source on their own Windows machine without Rust.
name: Windows x64

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - apps/pdfcraft/**
      - apps/pdfcraft-cli/**
      - .github/workflows/windows-x64.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: native x64 package and test executable
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_BUILD_JOBS: '2'
      PDFCRAFT_REQUIRE_WINRES: '1'
      CRAFT_FONTS_REQUIRED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts
      - name: Configure bundled fonts and build identity
        shell: pwsh
        run: |
          "CRAFT_FONTS_DIR=$env:GITHUB_WORKSPACE\craft-fonts" >> $env:GITHUB_ENV
          $commit = git rev-parse --short=8 HEAD
          "PDFCRAFT_BUILD_LABEL=deepseek-win-$commit" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-x64-release
      - name: Build desktop, CLI and offline UI tests
        shell: pwsh
        run: |
          cargo build --release --locked -j 2 -p pdfcraft -p pdfcraft-cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release --locked -j 2 -p pdfcraft-ui-egui --lib --no-run --message-format=json > windows-test-build.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and hash
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/PdfCraft/licenses, dist/qa | Out-Null
          Copy-Item target/release/pdfcraft.exe, target/release/pdfcraft-cli.exe dist/PdfCraft/
          Copy-Item NOTICE, ATTRIBUTION.md, LICENSE-MIT, LICENSE-APACHE dist/PdfCraft/licenses/
          Copy-Item docs/licenses/OFL-STIX-Two-Math.txt dist/PdfCraft/licenses/
          Copy-Item assets/fonts/OFL-*.txt dist/PdfCraft/licenses/
          Get-ChildItem craft-fonts -Recurse -Filter 'OFL*.txt' | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath((Resolve-Path craft-fonts), $_.FullName)
            $name = 'craft-fonts-' + ($relative -replace '[\\/]', '-')
            Copy-Item $_.FullName (Join-Path dist/PdfCraft/licenses $name)
          }
          $test = Get-Content windows-test-build.jsonl | ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'pdfcraft_ui_egui' -and $_.profile.test -and $_.executable } |
            Select-Object -Last 1
          if (-not $test) { throw 'UI test executable not found in Cargo artifacts' }
          Copy-Item $test.executable dist/qa/ui-tests.exe
          $commit = git rev-parse HEAD
          $files = Get-ChildItem dist -Recurse -File | ForEach-Object {
            @{ path = [IO.Path]::GetRelativePath((Resolve-Path dist), $_.FullName); sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          @{ commit = $commit; architecture = 'x86_64-pc-windows-msvc'; build_label = $env:PDFCRAFT_BUILD_LABEL; signed = $false; files = @($files) } |
            ConvertTo-Json -Depth 5 | Set-Content dist/build-manifest.json -Encoding utf8
          Compress-Archive -Path dist/PdfCraft, dist/qa, dist/build-manifest.json -DestinationPath dist/pdfcraft-windows-x64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdfcraft-windows-x64
          path: dist/pdfcraft-windows-x64.zip
          retention-days: 14
